# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm"
    commit-message:
      prefix: "chore: "
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/coverage-v8"

  - package-ecosystem: "github-actions"
    directory: "/"
    commit-message:
      prefix: "chore: "
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
